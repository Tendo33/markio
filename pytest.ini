[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts =
    -v
    -s
    -m "not live"
    --durations=10
    --durations-min=0.1
    --tb=short
asyncio_mode = auto
norecursedirs = .git .venv venv env __pycache__ .pytest_cache
console_output_style = progress
markers =
    live: tests that require a running external Markio service
