name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Python tests are not run in CI: the full dependency set (torch, docling, OCR models) is very heavy.
      - run: uv lock --check
      - run: uvx ruff@0.14.5 check .
      - run: python3 -m compileall -q markio tests scripts
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
        working-directory: frontend
      - run: pnpm run build
        working-directory: frontend

  # The CUDA final image installs torch, vLLM, and MinerU models. That build is
  # too large for this runner. This job checks the frontend stage, which is the
  # part that otherwise drifts from the Node version used above.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          target: frontend-builder
          push: false
          tags: markio-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
